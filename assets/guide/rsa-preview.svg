<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" role="img"><title>公钥去 A，私钥留 B</title><rect width="640" height="301" rx="10" fill="#edf4f7"/><g font-family="system-ui, sans-serif" font-size="16" fill="#152d44"><text x="22" y="35" font-size="22" font-weight="700">公钥去 A，私钥留 B</text><rect x="22" y="57" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="88" r="16" fill="#166a73"/><text x="51" y="94" fill="white" text-anchor="middle">1</text><text x="80" y="82" font-weight="700">B 生成本轮密钥</text><text x="80" y="105" fill="#42596a">当面与 A 核对公钥指纹；私钥始终留在 B。</text><rect x="22" y="134" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="165" r="16" fill="#166a73"/><text x="51" y="171" fill="white" text-anchor="middle">2</text><text x="80" y="159" font-weight="700">A 用核对后的公钥加密</text><text x="80" y="182" fill="#42596a">先发零速样例，记录本轮结果。</text><rect x="22" y="211" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="242" r="16" fill="#166a73"/><text x="51" y="248" fill="white" text-anchor="middle">3</text><text x="80" y="236" font-weight="700">B 解密并查看预览</text><text x="80" y="259" fill="#42596a">输出进入预览话题，分别检查断流与退出。</text></g></svg>