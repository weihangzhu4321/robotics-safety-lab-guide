<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" role="img"><title>SSH 口令练习的隔离边界</title><rect width="640" height="301" rx="10" fill="#edf4f7"/><g font-family="system-ui, sans-serif" font-size="16" fill="#152d44"><text x="22" y="35" font-size="22" font-weight="700">SSH 口令练习的隔离边界</text><rect x="22" y="57" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="88" r="16" fill="#166a73"/><text x="51" y="94" fill="white" text-anchor="middle">1</text><text x="80" y="82" font-weight="700">临时客户端</text><text x="80" y="105" fill="#42596a">只在本机隔离空间中读取脚本生成的虚构候选。</text><rect x="22" y="134" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="165" r="16" fill="#166a73"/><text x="51" y="171" fill="white" text-anchor="middle">2</text><text x="80" y="159" font-weight="700">虚拟网线 veth</text><text x="80" y="182" fill="#42596a">两端只相连，无默认路由，也无物理网卡。</text><rect x="22" y="211" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="242" r="16" fill="#166a73"/><text x="51" y="248" fill="white" text-anchor="middle">3</text><text x="80" y="236" font-weight="700">临时 SSH 服务</text><text x="80" y="259" fill="#42596a">记录拒绝和接受；结束后删除本轮隔离资源。</text></g></svg>