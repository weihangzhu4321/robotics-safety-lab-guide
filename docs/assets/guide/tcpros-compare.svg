<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" role="img"><title>同一条 TCPROS 连接怎样对照？</title><rect width="640" height="301" rx="10" fill="#edf4f7"/><g font-family="system-ui, sans-serif" font-size="16" fill="#152d44"><text x="22" y="35" font-size="22" font-weight="700">同一条 TCPROS 连接怎样对照？</text><rect x="22" y="57" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="88" r="16" fill="#166a73"/><text x="51" y="94" fill="white" text-anchor="middle">1</text><text x="80" y="82" font-weight="700">A 发出零速消息</text><text x="80" y="105" fill="#42596a">先确认唯一速度源、实际连接以及消息内容。</text><rect x="22" y="134" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="165" r="16" fill="#166a73"/><text x="51" y="171" fill="white" text-anchor="middle">2</text><text x="80" y="159" font-weight="700">M 对照入向与出向</text><text x="80" y="182" fill="#42596a">匹配方向、序号、有效载荷长度和 Twist 内容。</text><rect x="22" y="211" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="242" r="16" fill="#166a73"/><text x="51" y="248" fill="white" text-anchor="middle">3</text><text x="80" y="236" font-weight="700">B 端复查</text><text x="80" y="259" fill="#42596a">ACK 能佐证 TCP 接收，另查订阅回执及底盘状态。</text></g></svg>