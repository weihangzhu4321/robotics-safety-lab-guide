<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" role="img"><title>把实验十一的三类证据分开</title><rect width="640" height="301" rx="10" fill="#edf4f7"/><g font-family="system-ui, sans-serif" font-size="16" fill="#152d44"><text x="22" y="35" font-size="22" font-weight="700">把实验十一的三类证据分开</text><rect x="22" y="57" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="88" r="16" fill="#166a73"/><text x="51" y="94" fill="white" text-anchor="middle">1</text><text x="80" y="82" font-weight="700">Gazebo 编队</text><text x="80" y="105" fill="#42596a">用仿真轨迹检查到达误差与最小车距。</text><rect x="22" y="134" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="165" r="16" fill="#166a73"/><text x="51" y="171" fill="white" text-anchor="middle">2</text><text x="80" y="159" font-weight="700">隔离 Action 测试</text><text x="80" y="182" fill="#42596a">单独检查客户端的状态与退出。</text><rect x="22" y="211" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="242" r="16" fill="#166a73"/><text x="51" y="248" fill="white" text-anchor="middle">3</text><text x="80" y="236" font-weight="700">真实车辆静态定位</text><text x="80" y="259" fill="#42596a">逐车查传感器。前向净空无效就不发速度。</text></g></svg>