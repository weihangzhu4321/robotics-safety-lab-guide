<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" role="img"><title>同一个服务做三次对照</title><rect width="640" height="301" rx="10" fill="#edf4f7"/><g font-family="system-ui, sans-serif" font-size="16" fill="#152d44"><text x="22" y="35" font-size="22" font-weight="700">同一个服务做三次对照</text><rect x="22" y="57" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="88" r="16" fill="#166a73"/><text x="51" y="94" fill="white" text-anchor="middle">1</text><text x="80" y="82" font-weight="700">开始前</text><text x="80" y="105" fill="#42596a">用固定探针保存成功次数、响应时间和时间戳。</text><rect x="22" y="134" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="165" r="16" fill="#166a73"/><text x="51" y="171" fill="white" text-anchor="middle">2</text><text x="80" y="159" font-weight="700">限量窗口内</text><text x="80" y="182" fill="#42596a">探针保持一致，同时抓包和记录 SYN 实际数量。</text><rect x="22" y="211" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="242" r="16" fill="#166a73"/><text x="51" y="248" fill="white" text-anchor="middle">3</text><text x="80" y="236" font-weight="700">窗口结束后</text><text x="80" y="259" fill="#42596a">用同样探针再测，检查服务和路由已恢复。</text></g></svg>