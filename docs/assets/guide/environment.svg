<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" role="img"><title>命令要在哪一层运行？</title><rect width="640" height="301" rx="10" fill="#edf4f7"/><g font-family="system-ui, sans-serif" font-size="16" fill="#152d44"><text x="22" y="35" font-size="22" font-weight="700">命令要在哪一层运行？</text><rect x="22" y="57" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="88" r="16" fill="#166a73"/><text x="51" y="94" fill="white" text-anchor="middle">1</text><text x="80" y="82" font-weight="700">Windows 宿主机</text><text x="80" y="105" fill="#42596a">打开 VMware，检查虚拟机网卡与导入位置。</text><rect x="22" y="134" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="165" r="16" fill="#166a73"/><text x="51" y="171" fill="white" text-anchor="middle">2</text><text x="80" y="159" font-weight="700">Ubuntu 虚拟机 A</text><text x="80" y="182" fill="#42596a">配置网络，打开 Ubuntu 终端，启动课程环境。</text><rect x="22" y="211" width="596" height="62" rx="7" fill="white" stroke="#9cb7c4"/><circle cx="51" cy="242" r="16" fill="#166a73"/><text x="51" y="248" fill="white" text-anchor="middle">3</text><text x="80" y="236" font-weight="700">ROS1 容器 shell</text><text x="80" y="259" fill="#42596a">确认 Noetic 后再运行 rostopic 等 ROS1 命令。</text></g></svg>